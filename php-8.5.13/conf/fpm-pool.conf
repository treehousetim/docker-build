; Production pool. Sizing comes from PHP_FPM_* env vars (defaults set in the
; Dockerfile, tuned for a 4 GB RAM server -- see README.md "Server sizing").
; Deployment-specific bits (user, unix socket, open_basedir, log paths, env)
; belong to the deployment; the image keeps the stock www-data user and
; listens on 9000.
[www]
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_SERVERS}
pm.max_requests = ${PHP_FPM_MAX_REQUESTS}
request_terminate_timeout = ${PHP_FPM_REQUEST_TERMINATE_TIMEOUT}

; Per-request memory cap for web requests, sized with pm.max_children so the
; pool can't exceed RAM. php_value (not php_admin_value), so a script that
; genuinely needs more can still ini_set() it. CLI keeps php-prod.ini's 256M.
php_value[memory_limit] = ${PHP_FPM_MEMORY_LIMIT}
security.limit_extensions = .php

; No shelling out under FPM -- don't rely on it in web requests.
; (CLI images keep exec for cron jobs and scripts.)
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,show_source

; No status/ping pages: pm.status_path has had XSS bugs (CVE-2026-6735,
; CVE-2026-129292) and leaks request URIs. Both are off when unset -- do NOT
; write "ping.path =": FPM 8.5.13 treats an empty value as set, demands
; ping.response, and every worker dies on startup. Enable per deployment,
; behind auth. test.sh checks neither is set and that a real request works.
