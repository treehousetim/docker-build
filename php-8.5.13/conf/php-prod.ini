; Production hardening and limits. Loaded in every image; the dev images
; override the error/cookie bits in 95-dev.ini.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
allow_url_include = Off
session.upload_progress.enabled = Off
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_only_cookies = 1
date.timezone = America/Chicago
memory_limit = 256M
upload_max_filesize = 100M
post_max_size = 110M
max_execution_time = 60

; FastCGI: never guess the script from a mangled path (stops /upload.jpg/x.php
; being run as PHP). nginx's fastcgi_split_path_info still provides PATH_INFO.
cgi.fix_pathinfo = 0
; Phar archives can't be written or re-signed at runtime.
phar.readonly = On
; Don't put function arguments (passwords, tokens) in stack traces.
zend.exception_ignore_args = On
